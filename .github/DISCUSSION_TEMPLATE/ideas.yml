title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Have a feature idea but want to discuss it before opening an
        issue? You're in the right place. Concrete proposals tend to
        get traction faster than open-ended wishes.

  - type: textarea
    id: problem
    attributes:
      label: What's the gap?
      description: What's hard or impossible to do today that the idea would unlock?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Rough API sketch or a description of the desired behavior. Code is welcome.
      render: markdown

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one wins.

  - type: input
    id: scope
    attributes:
      label: Rough scope
      description: How big do you think this is? Tiny / Medium / Large.
      placeholder: Medium
